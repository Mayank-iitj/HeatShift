AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HeatShift — Turns weather forecasts into safe work schedules for outdoor
  workers in Delhi. Environmental Hacks hackathon (WeMakeDevs x AWS).

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Architectures:
      - x86_64
    Environment:
      Variables:
        DDB_TABLE_PREFIX: !Ref AWS::StackName
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        TELEGRAM_TOKEN_SSM_KEY: !Ref TelegramTokenSSMKey
        TELEGRAM_SECRET_SSM_KEY: !Ref TelegramSecretSSMKey
        ENABLE_SMS: !Ref EnableSMS
        WEBSOCKET_API_URL: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
        CLOUDFRONT_DOMAIN: !If [HasCloudFront, !GetAtt CloudFrontDistribution.DomainName, ""]
        HEATSHIFT_CONFIG_DIR: /var/task/config
        HEATSHIFT_DATA_DIR: /var/task/data

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model ID for the planning agent
  TelegramTokenSSMKey:
    Type: String
    Default: /heatshift/telegram-token
  TelegramSecretSSMKey:
    Type: String
    Default: /heatshift/telegram-secret
  EnableSMS:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  FrontendBucketName:
    Type: String
    Default: ""
  BudgetAlarmEmail:
    Type: String
    Default: ""

Conditions:
  HasCloudFront: !Not [!Equals [!Ref FrontendBucketName, ""]]
  HasBudgetAlarm: !Not [!Equals [!Ref BudgetAlarmEmail, ""]]

Resources:
  # ── DynamoDB Tables ──

  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Readings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: zone_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: zone_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Sites"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
        - AttributeName: zone_id
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: zone-index
          KeySchema:
            - AttributeName: zone_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Plans"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Alerts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
        - AttributeName: sent_at
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH
        - AttributeName: sent_at
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  ConfirmationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Confirmations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
        - AttributeName: confirmed_at
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH
        - AttributeName: confirmed_at
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Metrics"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: metric_key
          AttributeType: S
      KeySchema:
        - AttributeName: metric_key
          KeyType: HASH

  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-State"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: state_key
          AttributeType: S
      KeySchema:
        - AttributeName: state_key
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: subscribed_to
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: subscription-index
          KeySchema:
            - AttributeName: subscribed_to
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  FeedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Feed"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_type
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: event_type
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Common Lambda Layer ──

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-common"
      Description: Shared code for HeatShift Lambda functions
      ContentUri: ./layers/common/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  # ── Lambda Functions ──

  IngestScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingest-score"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/ingest_score/
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReadingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Hourly weather ingest and scoring
            Enabled: true

  PlanAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-plan-agent"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/plan_agent/
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReadingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        DailyPlan:
          Type: Schedule
          Properties:
            Schedule: cron(30 23 * * ? *)  # 05:00 IST = 23:30 UTC previous day
            Description: Daily plan generation at 05:00 IST
            Enabled: true

  AlertDispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-alert-dispatch"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/alert_dispatch/
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref TelegramTokenSSMKey
        - SNSPublishMessagePolicy:
            TopicName: !Sub "${AWS::StackName}-alerts"

  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-telegram-webhook"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/telegram_webhook/
      Timeout: 15
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfirmationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref TelegramTokenSSMKey
        - SSMParameterReadPolicy:
            ParameterName: !Ref TelegramSecretSSMKey
      Events:
        TelegramPost:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /telegram/webhook
            Method: POST

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/api/
      Timeout: 15
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReadingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfirmationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:StopExecution
                - states:DescribeExecution
              Resource: !Ref ReplayStateMachine
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt PlanAgentFunction.Arn
      Events:
        GetZones:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /zones
            Method: GET
        GetZoneForecast:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /zones/{id}/forecast
            Method: GET
        CreateSite:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites
            Method: POST
        GetSite:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{id}
            Method: GET
        GetSitePlans:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{id}/plans
            Method: GET
        Replan:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{id}/replan
            Method: POST
        PostConfirmation:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /confirmations
            Method: POST
        GetMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /metrics
            Method: GET
        GetFeed:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /feed
            Method: GET
        ReplayStart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /replay/start
            Method: POST
        ReplayStop:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /replay/stop
            Method: POST
        ReplayReset:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /replay/reset
            Method: POST
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: GET

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ws-connect"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/ws_connect/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ws-disconnect"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/ws_disconnect/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  WsFanoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ws-fanout"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/ws_fanout/
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
      Events:
        ReadingsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ReadingsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
        PlansStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PlansTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
        AlertsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AlertsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
        ConfirmationsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ConfirmationsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10

  ReplayTickFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-replay-tick"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/replay_tick/
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReadingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt IngestScoreFunction.Arn

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-metrics"
      Handler: handler.lambda_handler
      CodeUri: backend/functions/metrics/
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfirmationsTable
        - CloudWatchPutMetricPolicy: {}

  # ── REST API ──

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"
      EndpointConfiguration:
        Type: REGIONAL

  # ── WebSocket API ──

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-ws"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations"

  SubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: subscribe
      AuthorizationType: NONE
      Target: !Sub "integrations/${SubscribeIntegration}"

  SubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations"

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ── SNS ──

  AlertSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"

  # ── Step Functions (Replay) ──

  ReplayStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-replay"
      DefinitionUri: statemachines/replay.asl.json
      DefinitionSubstitutions:
        ReplayTickFunctionArn: !GetAtt ReplayTickFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ReplayTickFunction

  # ── S3 + CloudFront (Frontend) ──

  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: HasCloudFront
    Properties:
      BucketName: !Ref FrontendBucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCloudFront
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ── CloudWatch Dashboard ──

  HeatShiftDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "title": "Lambda Errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${IngestScoreFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${PlanAgentFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${AlertDispatchFunction}", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              },
              "width": 12,
              "height": 6
            },
            {
              "type": "metric",
              "properties": {
                "title": "Lambda Duration",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${IngestScoreFunction}", {"stat": "Average"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${PlanAgentFunction}", {"stat": "Average"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              },
              "width": 12,
              "height": 6
            }
          ]
        }

  # ── CloudWatch Alarms ──

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ingest-errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestScoreFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold

  # ── Budget Alarm ──

  BudgetAlarm:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetAlarm
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-budget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlarmEmail

Outputs:
  RestApiUrl:
    Description: REST API URL
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  WebSocketUrl:
    Description: WebSocket API URL
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CloudFrontUrl:
    Condition: HasCloudFront
    Description: CloudFront Distribution URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  ReadingsTableName:
    Value: !Ref ReadingsTable
  SitesTableName:
    Value: !Ref SitesTable
  PlansTableName:
    Value: !Ref PlansTable
