<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="60" cy="60" r="46" fill="url(#sunGlow)" filter="url(#blurShadow)" opacity="0.25" />

  <!-- Radiating Sun Flares -->
  <g stroke="url(#sunGlow)" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="10" x2="60" y2="20" />
    <line x1="60" y1="100" x2="60" y2="110" />
    <line x1="10" y1="60" x2="20" y2="60" />
    <line x1="100" y1="60" x2="110" y2="60" />
    <line x1="24.6" y1="24.6" x2="31.7" y2="31.7" />
    <line x1="88.3" y1="88.3" x2="95.4" y2="95.4" />
    <line x1="24.6" y1="95.4" x2="31.7" y2="88.3" />
    <line x1="88.3" y1="31.7" x2="95.4" y2="24.6" />
  </g>

  <!-- Central Core Orb -->
  <circle cx="60" cy="60" r="30" fill="url(#sunGlow)" />

  <!-- Protective Shift Shield Icon in Center -->
  <path d="M60 40 L74 46 V58 C74 68 68 76 60 80 C52 76 46 68 46 58 V46 Z" 
        fill="#0a0a0a" 
        stroke="white" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Heat Wave Dynamic Vector inside Shield -->
  <path d="M54 62 C56 59 58 59 60 62 C62 65 64 65 66 62" 
        stroke="url(#shieldGlow)" 
        stroke-width="2.5" 
        stroke-linecap="round" />
  <path d="M54 56 C56 53 58 53 60 56 C62 59 64 59 66 56" 
        stroke="#f97316" 
        stroke-width="2" 
        stroke-linecap="round" />
</svg>
