AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "HeatShift \u2014 Turns weather forecasts into safe work schedules for\
  \ outdoor workers in Delhi. Environmental Hacks hackathon (WeMakeDevs x AWS).\n"
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Architectures:
    - x86_64
    Environment:
      Variables:
        DDB_TABLE_PREFIX:
          Ref: AWS::StackName
        AWS_REGION_NAME:
          Ref: AWS::Region
        BEDROCK_MODEL_ID:
          Ref: BedrockModelId
        TELEGRAM_TOKEN_SSM_KEY:
          Ref: TelegramTokenSSMKey
        TELEGRAM_SECRET_SSM_KEY:
          Ref: TelegramSecretSSMKey
        ENABLE_SMS:
          Ref: EnableSMS
        WEBSOCKET_API_URL:
          Fn::Sub: https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
        CLOUDFRONT_DOMAIN:
          Fn::If:
          - HasCloudFront
          - Fn::GetAtt:
            - CloudFrontDistribution
            - DomainName
          - ''
        HEATSHIFT_CONFIG_DIR: /var/task/config
        HEATSHIFT_DATA_DIR: /var/task/data
Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model ID for the planning agent
  TelegramTokenSSMKey:
    Type: String
    Default: /heatshift/telegram-token
  TelegramSecretSSMKey:
    Type: String
    Default: /heatshift/telegram-secret
  EnableSMS:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
  FrontendBucketName:
    Type: String
    Default: ''
  BudgetAlarmEmail:
    Type: String
    Default: ''
Conditions:
  HasCloudFront:
    Fn::Not:
    - Fn::Equals:
      - Ref: FrontendBucketName
      - ''
  HasBudgetAlarm:
    Fn::Not:
    - Fn::Equals:
      - Ref: BudgetAlarmEmail
      - ''
Resources:
  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Readings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: zone_id
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: zone_id
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Sites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: site_id
        AttributeType: S
      - AttributeName: zone_id
        AttributeType: S
      KeySchema:
      - AttributeName: site_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: zone-index
        KeySchema:
        - AttributeName: zone_id
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Plans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: site_id
        AttributeType: S
      - AttributeName: created_at
        AttributeType: S
      KeySchema:
      - AttributeName: site_id
        KeyType: HASH
      - AttributeName: created_at
        KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: site_id
        AttributeType: S
      - AttributeName: sent_at
        AttributeType: S
      KeySchema:
      - AttributeName: site_id
        KeyType: HASH
      - AttributeName: sent_at
        KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  ConfirmationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Confirmations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: site_id
        AttributeType: S
      - AttributeName: confirmed_at
        AttributeType: S
      KeySchema:
      - AttributeName: site_id
        KeyType: HASH
      - AttributeName: confirmed_at
        KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Metrics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: metric_key
        AttributeType: S
      KeySchema:
      - AttributeName: metric_key
        KeyType: HASH
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-State
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: state_key
        AttributeType: S
      KeySchema:
      - AttributeName: state_key
        KeyType: HASH
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: connection_id
        AttributeType: S
      - AttributeName: subscribed_to
        AttributeType: S
      KeySchema:
      - AttributeName: connection_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: subscription-index
        KeySchema:
        - AttributeName: subscribed_to
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  FeedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Feed
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: event_type
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: event_type
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${AWS::StackName}-common
      Description: Shared code for HeatShift Lambda functions
      ContentUri: CommonLayer
      CompatibleRuntimes:
      - python3.12
    Metadata:
      BuildMethod: python3.12
      SamResourceId: CommonLayer
  IngestScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-ingest-score
      Handler: handler.lambda_handler
      CodeUri: IngestScoreFunction
      Timeout: 60
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ReadingsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StateTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedTable
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Hourly weather ingest and scoring
            Enabled: true
    Metadata:
      SamResourceId: IngestScoreFunction
  PlanAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-plan-agent
      Handler: handler.lambda_handler
      CodeUri: PlanAgentFunction
      Timeout: 60
      MemorySize: 512
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SitesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PlansTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ReadingsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StateTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedTable
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          - bedrock:InvokeModelWithResponseStream
          Resource: '*'
      Events:
        DailyPlan:
          Type: Schedule
          Properties:
            Schedule: cron(30 23 * * ? *)
            Description: Daily plan generation at 05:00 IST
            Enabled: true
    Metadata:
      SamResourceId: PlanAgentFunction
  AlertDispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-alert-dispatch
      Handler: handler.lambda_handler
      CodeUri: AlertDispatchFunction
      Timeout: 30
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AlertsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SitesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedTable
      - SSMParameterReadPolicy:
          ParameterName:
            Ref: TelegramTokenSSMKey
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::Sub: ${AWS::StackName}-alerts
    Metadata:
      SamResourceId: AlertDispatchFunction
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-telegram-webhook
      Handler: handler.lambda_handler
      CodeUri: TelegramWebhookFunction
      Timeout: 15
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SitesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConfirmationsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PlansTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MetricsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedTable
      - SSMParameterReadPolicy:
          ParameterName:
            Ref: TelegramTokenSSMKey
      - SSMParameterReadPolicy:
          ParameterName:
            Ref: TelegramSecretSSMKey
      Events:
        TelegramPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /telegram/webhook
            Method: POST
    Metadata:
      SamResourceId: TelegramWebhookFunction
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-api
      Handler: handler.lambda_handler
      CodeUri: ApiFunction
      Timeout: 15
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ReadingsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SitesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PlansTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AlertsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConfirmationsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MetricsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StateTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedTable
      - Statement:
        - Effect: Allow
          Action:
          - states:StartExecution
          - states:StopExecution
          - states:DescribeExecution
          Resource:
            Ref: ReplayStateMachine
      - Statement:
        - Effect: Allow
          Action:
          - lambda:InvokeFunction
          Resource:
            Fn::GetAtt:
            - PlanAgentFunction
            - Arn
      Events:
        GetZones:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /zones
            Method: GET
        GetZoneForecast:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /zones/{id}/forecast
            Method: GET
        CreateSite:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /sites
            Method: POST
        GetSite:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /sites/{id}
            Method: GET
        GetSitePlans:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /sites/{id}/plans
            Method: GET
        Replan:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /sites/{id}/replan
            Method: POST
        PostConfirmation:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /confirmations
            Method: POST
        GetMetrics:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /metrics
            Method: GET
        GetFeed:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /feed
            Method: GET
        ReplayStart:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /replay/start
            Method: POST
        ReplayStop:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /replay/stop
            Method: POST
        ReplayReset:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /replay/reset
            Method: POST
        Health:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /health
            Method: GET
    Metadata:
      SamResourceId: ApiFunction
  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-ws-connect
      Handler: handler.lambda_handler
      CodeUri: WsConnectFunction
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WsConnectFunction
  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-ws-disconnect
      Handler: handler.lambda_handler
      CodeUri: WsDisconnectFunction
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WsDisconnectFunction
  WsFanoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-ws-fanout
      Handler: handler.lambda_handler
      CodeUri: WsFanoutFunction
      Timeout: 30
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
      Events:
        ReadingsStream:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - ReadingsTable
              - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
        PlansStream:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - PlansTable
              - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
        AlertsStream:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - AlertsTable
              - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
        ConfirmationsStream:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - ConfirmationsTable
              - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
    Metadata:
      SamResourceId: WsFanoutFunction
  ReplayTickFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-replay-tick
      Handler: handler.lambda_handler
      CodeUri: ReplayTickFunction
      Timeout: 60
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ReadingsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StateTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedTable
      - Statement:
        - Effect: Allow
          Action:
          - lambda:InvokeFunction
          Resource:
            Fn::GetAtt:
            - IngestScoreFunction
            - Arn
    Metadata:
      SamResourceId: ReplayTickFunction
  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-metrics
      Handler: handler.lambda_handler
      CodeUri: MetricsFunction
      Layers:
      - Ref: CommonLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MetricsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConfirmationsTable
      - CloudWatchPutMetricPolicy: {}
    Metadata:
      SamResourceId: MetricsFunction
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-api
      StageName: prod
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key'''
        AllowOrigin: '''*'''
      EndpointConfiguration:
        Type: REGIONAL
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: WebSocketApi
      StageName: prod
      AutoDeploy: true
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${ConnectIntegration}
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${DisconnectIntegration}
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations
  SubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: subscribe
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${SubscribeIntegration}
  SubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations
  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
  AlertSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${AWS::StackName}-alerts
  ReplayStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-replay
      DefinitionUri: ..\..\statemachines\replay.asl.json
      DefinitionSubstitutions:
        ReplayTickFunctionArn:
          Fn::GetAtt:
          - ReplayTickFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReplayTickFunction
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: HasCloudFront
    Properties:
      BucketName:
        Ref: FrontendBucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCloudFront
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasCloudFront
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
        - Id: S3Origin
          DomainName:
            Fn::GetAtt:
            - FrontendBucket
            - RegionalDomainName
          OriginAccessControlId:
            Ref: CloudFrontOAC
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
        - ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath: /index.html
        - ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath: /index.html
  HeatShiftDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: ${AWS::StackName}-dashboard
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"metric\",\n      \"\
          properties\": {\n        \"title\": \"Lambda Errors\",\n        \"metrics\"\
          : [\n          [\"AWS/Lambda\", \"Errors\", \"FunctionName\", \"${IngestScoreFunction}\"\
          , {\"stat\": \"Sum\"}],\n          [\"AWS/Lambda\", \"Errors\", \"FunctionName\"\
          , \"${PlanAgentFunction}\", {\"stat\": \"Sum\"}],\n          [\"AWS/Lambda\"\
          , \"Errors\", \"FunctionName\", \"${AlertDispatchFunction}\", {\"stat\"\
          : \"Sum\"}]\n        ],\n        \"period\": 300,\n        \"region\": \"\
          ${AWS::Region}\"\n      },\n      \"width\": 12,\n      \"height\": 6\n\
          \    },\n    {\n      \"type\": \"metric\",\n      \"properties\": {\n \
          \       \"title\": \"Lambda Duration\",\n        \"metrics\": [\n      \
          \    [\"AWS/Lambda\", \"Duration\", \"FunctionName\", \"${IngestScoreFunction}\"\
          , {\"stat\": \"Average\"}],\n          [\"AWS/Lambda\", \"Duration\", \"\
          FunctionName\", \"${PlanAgentFunction}\", {\"stat\": \"Average\"}]\n   \
          \     ],\n        \"period\": 300,\n        \"region\": \"${AWS::Region}\"\
          \n      },\n      \"width\": 12,\n      \"height\": 6\n    }\n  ]\n}\n"
  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-ingest-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: IngestScoreFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
  BudgetAlarm:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetAlarm
    Properties:
      Budget:
        BudgetName:
          Fn::Sub: ${AWS::StackName}-budget
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 80
        Subscribers:
        - SubscriptionType: EMAIL
          Address:
            Ref: BudgetAlarmEmail
Outputs:
  RestApiUrl:
    Description: REST API URL
    Value:
      Fn::Sub: https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  WebSocketUrl:
    Description: WebSocket API URL
    Value:
      Fn::Sub: wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  CloudFrontUrl:
    Condition: HasCloudFront
    Description: CloudFront Distribution URL
    Value:
      Fn::Sub: https://${CloudFrontDistribution.DomainName}
  ReadingsTableName:
    Value:
      Ref: ReadingsTable
  SitesTableName:
    Value:
      Ref: SitesTable
  PlansTableName:
    Value:
      Ref: PlansTable
